<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePen Tile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="tileContainer">
        <img src="https://images.unsplash.com/photo-1762194478408-224bf9f13373?q=80&w=1114&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="thumbnail ">
        <div class="info">
            <div class="userData">
                <img src="https://assets.codepen.io/12149712/internal/avatars/users/default.png?fit=crop&format=auto&height=80&version=1738235601&width=80"
                    alt="user logo image">
                <div class="title_n_name">
                    <p class="title">Electric Border</p>
                    <p class="name">Tom Miller</p>
                </div>
            </div>
            <i class="fa-solid fa-ellipsis optionsIcon"></i>
        </div>
        <div class="tileData">
            <p class="likes"><i class="fa-solid fa-heart"></i>472</p>
            <p class="replies"><i class="fa-solid fa-message"></i>56</p>
            <p class="views"><i class="fa-solid fa-eye"></i>2,341</p> 
        </div>

    </div>

    <script src="https://kit.fontawesome.com/4fce346de8.js"
        crossorigin="anonymous"></script>
</body>
</html>
