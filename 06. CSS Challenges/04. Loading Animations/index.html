<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animations</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./glowingcicle_01.css">
    <link rel="stylesheet" href="./pulse_02.css">
</head>
<body>
    <div class="container">
        <div class="LoadingBox">
            <div class="wrapper">
                <div class="circle1">
                    <div class="circle2"></div>
                </div>
            </div>
        </div>
        <div class="LoadingBox">
            <div class="pulse">
                <svg width="64px" height="48px">
                    <polyline
                        points="0.157 23.954, 14 23.954, 21.843 48, 43 0, 50 24, 64 24"
                        id="back"></polyline>
                    <polyline
                        points="0.157 23.954, 14 23.954, 21.843 48, 43 0, 50 24, 64 24"
                        id="front"></polyline>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
